name: Test and build container images

on:
  push:
    branches:
      - main

  release:
    types: [published]

  pull_request:

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Dynamically find the image name
        id: get-image-name
        run: |
          image_name="${GITHUB_REPOSITORY#*/}"
          image_name="${image_name#docker-}"
          image_name=$(echo "$image_name" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Run tests
        run: |
          if [ -f docker-compose.test.yml ]; then
            docker-compose --file docker-compose.test.yml build
            docker-compose --file docker-compose.test.yml run sut
          else
            docker build . --file Dockerfile --tag ${{ steps.get-image-name.outputs.image_name }}
          fi

      - name: Run the Anchore scan action itself with GitHub Advanced Security code scanning integration enabled
        uses: anchore/scan-action@v7.4.2
        id: scan
        with:
          image: "${{ steps.get-image-name.outputs.image_name }}"
          fail-build: false
          severity-cutoff: high

  push:
    needs: test

    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Dynamically find the image name
        id: get-image-name
        run: |
          image_name="${GITHUB_REPOSITORY#*/}"
          image_name="${image_name#docker-}"
          image_name=$(echo "$image_name" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.get-image-name.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
